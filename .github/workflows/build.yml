name: Build Release APK (arm64)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # modul web menjalankan `pnpm run build` saat preBuild
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          package_json_file: web-ui/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Plugin google-services butuh file ini. Pakai secret bila ada, kalau tidak pakai placeholder
      # (cukup agar build lolos; Firebase tidak aktif tanpa file asli).
      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "lumi-ai-placeholder",
              "storage_bucket": "lumi-ai-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": { "package_name": "me.rerere.rikkahub" }
                },
                "api_key": [{ "current_key": "placeholder" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000002",
                  "android_client_info": { "package_name": "me.rerere.rikkahub.debug" }
                },
                "api_key": [{ "current_key": "placeholder" }]
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      # Tanda tangan: pakai secret KEY_BASE64 + SIGNING_CONFIG bila ada.
      # Kalau tidak ada, buat keystore baru supaya APK release tetap bisa diinstal.
      - name: Prepare signing
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: |
          if [ -n "$KEY_BASE64" ] && [ -n "$SIGNING_CONFIG" ]; then
            echo "$KEY_BASE64" | base64 -d > app/app.key
            printf '%s\n' "$SIGNING_CONFIG" > local.properties
          else
            keytool -genkeypair -v -keystore app/app.key -storetype PKCS12 \
              -alias lumi -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass lumi-ci-pass -keypass lumi-ci-pass \
              -dname "CN=Lumi AI, O=Lumi, C=ID"
            {
              echo "storeFile=app.key"
              echo "storePassword=lumi-ci-pass"
              echo "keyAlias=lumi"
              echo "keyPassword=lumi-ci-pass"
            } > local.properties
          fi

      - name: Build release APK (arm64, R8 minified)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumi-ai-arm64-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish latest release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Lumi AI (arm64 release)
          prerelease: true
          files: app/build/outputs/apk/release/*.apk

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore
